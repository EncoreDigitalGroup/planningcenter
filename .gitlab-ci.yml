# GitLab CI Pipeline — planningcenter-php-sdk
#
# Required CI/CD Variables (Settings > CI/CD > Variables):
#   COMPOSER_AUTH           — masked; JSON authentication for private Composer packages (if any private deps).
#   ENCOREBOT_ACCESS_TOKEN  — masked; API-scoped token for release notes and Trivy MR comments.
#
# Required project setting:
#   Settings > Repository > "Allow CI job token to push to this project" must be
#   enabled for the code_style job to push formatting commits back to the MR branch.
#
# Pipeline overview:
#   MR:       trivy_scan, then jobs whose relevant PHP files changed.
#   v*.*.*:   full quality, then release.

workflow:
    auto_cancel:
        on_new_commit: interruptible

include:
    -   project: internal/ci-pipelines
        ref: main
        file:
            - /workflows/php/code-style.yml
            - /workflows/php/static-analysis.yml
            - /workflows/php/test.yml
            - /workflows/gitlab/create-release.yml
            - /workflows/security/trivy-scan.yml

stages:
    - security
    - quality
    - test
    - release

default:
    interruptible: true

# Release tags always run the complete quality suite before a release is created.
# Overriding a job's `rules` replaces the template's, so each job references this
# shared rule rather than duplicating it.
.rules:
    release_tag: &release_tag_rule
        if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

trivy_scan:
    stage: security
    extends: .trivy:scan

code_style:
    stage: quality
    extends: .php:code-style
    image: "$PHP_CI_IMAGE"
    # Rector and Duster only format PHP, so skip MRs with no PHP changes.
    rules:
        -   if: $CI_PIPELINE_SOURCE == "merge_request_event"
            changes:
                - "**/*.php"
        - *release_tag_rule

static_analysis:
    stage: quality
    extends: .php:static-analysis
    variables:
        PHPSTAN_PATHS: "src/"
    image: "$PHP_CI_IMAGE"
    # Run PHPStan when source, its configuration, or dependency type stubs change.
    rules:
        -   if: $CI_PIPELINE_SOURCE == "merge_request_event"
            changes:
                - "**/*.php"
                - "phpstan.neon"
                - "composer.json"
                - "composer.lock"
        - *release_tag_rule

test:
    stage: test
    extends: .php:test
    image: "$PHP_CI_IMAGE"
    # Run Pest when code, dependencies, or its configuration changes.
    rules:
        -   if: $CI_PIPELINE_SOURCE == "merge_request_event"
            changes:
                - "**/*.php"
                - "composer.json"
                - "composer.lock"
                - "phpunit.xml"
        - *release_tag_rule

release:
    stage: release
    extends: .gitlab:create-release
    interruptible: false
    rules:
        -   if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(?:rc|alpha|beta)\d+)?$/
